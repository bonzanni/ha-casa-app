[pytest]
# Casa Browser's own pytest configuration: `pytest casa_browser/tests` from the
# repository root finds this file before the root pytest.ini (Casa's).
# Unit and image lanes intentionally share test module basenames.
addopts = --import-mode=importlib
pythonpath = tests tests/integration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
markers =
    slow: tests that take a long time (opt-out: excluded from the default unit selection)
    docker: needs Docker or the built image (opt-out: run via make test-browser-integration)
