# Casa Browser's ingress listener (Plan 1 Task 13). Runs as casa-ingress (uid 1105). Only Home
# Assistant's ingress peer is admitted (ingress-peer.conf: "allow <peer>; deny all;", rendered
# at start); everything else is refused before any request reaches the UI. Supervisor strips
# the ingress prefix and sends X-Ingress-Path; the UI checks it and builds every URL from it.
daemon off;
worker_processes 1;
pid /run/casa-browser/nginx/nginx.pid;
error_log stderr crit;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    log_not_found off;
    server_tokens off;
    sendfile on;
    client_max_body_size 64k;
    client_body_temp_path /run/casa-browser/nginx/body;
    proxy_temp_path /run/casa-browser/nginx/proxy;
    fastcgi_temp_path /run/casa-browser/nginx/fastcgi;
    uwsgi_temp_path /run/casa-browser/nginx/uwsgi;
    scgi_temp_path /run/casa-browser/nginx/scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    upstream casa_ui {
        server unix:/run/casa-browser/ui/ui.sock;
    }

    server {
        listen 8099;
        include /run/casa-browser/nginx/ingress-peer.conf;

        # The app's own scripts and styles, and noVNC's client modules (no app shell of noVNC).
        # The UI sets its own headers on everything it serves.
        location /static/ {
            alias /opt/casa_browser/static/;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
        location /novnc/core/ {
            alias /usr/share/novnc/core/;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
        location /novnc/vendor/ {
            alias /usr/share/novnc/vendor/;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location / {
            proxy_pass http://casa_ui;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
    }
}
