- doc: architecture/telegram-reply-drafts.md
  summary: How a reply in a private Telegram chat is written into a draft while the model writes it — the draft stream and its clock, the draft call, its end before the ordinary send — and what Stop on the draft does to the running turn.
  when_changing: a reply's draft while the model writes it, the draft stream's clock or its draft call, which chats get a draft, the Stop button on a draft or the stopped_message_generation update, interrupting a pooled turn, or what a stopped turn delivers
  covers:
    - casa/rootfs/opt/casa/channels/telegram_draft.py
    - casa/rootfs/opt/casa/channels/telegram.py::TelegramChannel.create_on_token
    - casa/rootfs/opt/casa/channels/telegram.py::TelegramChannel._send_draft
    - casa/rootfs/opt/casa/channels/telegram.py::TelegramChannel._on_stop_update
  tests:
    - tests/test_telegram_draft_stream.py
    - tests/test_telegram_stop_update.py
    - tests/test_turn_stop.py
    - tests/test_sdk_pool_stop.py
    - tests/test_agent_partial_streaming.py
