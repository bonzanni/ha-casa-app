# Manifest shard: the engagement documents about files root handles from outside an engagement
# (born in their own shard so the E shard, split at the 40 KB index ceiling, keeps its headroom).
- doc: architecture/engagement-transcript-reaping.md
  summary: Where a finished engagement's and a delegation's CLI transcripts are deleted — the retention, the run-confirmation gate the pass asks, what a terminal record names, what it never selects, and what it retries.
  when_changing: deleting a finished engagement's transcripts, or a delegated run's registration, confirmation or transcript retention
  covers:
    - casa/rootfs/opt/casa/engagement_transcript_reaper.py::reap_engagement_transcripts
    - casa/rootfs/opt/casa/engagement_transcript_reaper.py::transcript_cwd
    - casa/rootfs/opt/casa/tools.py::_register_delegated_run
  tests:
    - tests/test_engagement_transcript_reaper.py
    - tests/test_engagement_transcript_reaper_pins.py
    - tests/test_transcript_confirmation.py
    - tests/test_transcript_retention.py
    - tests/test_delegated_transcript_retention.py
  related: [architecture/engagement-finalization.md, architecture/memory-lifecycle.md, architecture/persistent-state.md, architecture/background-job-fresh-sessions.md]
  defines_invariants: [INV-ENG-027, INV-ENG-028]
  invariant_tests:
    INV-ENG-027: [tests/test_engagement_transcript_reaper.py::test_terminal_sdk_transcripts_are_reaped, tests/test_engagement_transcript_reaper_pins.py::test_named_sessions_go_in_the_record_dir_zero_byte_included, tests/test_engagement_transcript_reaper_pins.py::test_nothing_a_terminal_record_does_not_name_is_touched, tests/test_engagement_transcript_reaper_pins.py::test_a_live_engagement_is_never_touched, tests/test_engagement_transcript_reaper_pins.py::test_a_terminal_status_not_yet_on_disk_is_not_acted_on, tests/test_engagement_transcript_reaper_pins.py::test_a_session_named_after_a_pass_goes_on_the_next, tests/test_engagement_transcript_reaper_pins.py::test_the_reaper_imports_without_the_private_sdk_surface, tests/test_engagement_transcript_reaper_pins.py::test_an_unavailable_private_surface_deletes_nothing_and_retries, tests/test_engagement_transcript_reaper_pins.py::test_clearance_retired_sessions_survive_restart_until_terminal_reap, tests/test_engagement_transcript_reaper_pins.py::test_plugin_workdir_reaped_only_after_durable_terminal_independent_of_sdk, tests/test_engagement_transcript_reaper_pins.py::test_never_written_tombstone_is_quiet_but_waiting_terminal_warns, tests/test_engagement_transcript_reaper_pins.py::test_an_entry_vanishing_mid_walk_does_not_stop_the_removal, tests/test_transcript_retention.py::test_an_engagement_transcript_lives_its_retention_after_its_terminal_record, tests/test_transcript_confirmation.py::test_a_summary_row_blocks_until_its_summaries_are_captured, tests/test_transcript_confirmation.py::test_a_lost_terminal_flip_confirms_its_summary_row, tests/test_transcript_confirmation.py::test_a_summary_run_is_one_row_holding_its_folder, tests/test_transcript_gate_uncertainty.py::test_a_session_published_after_the_summary_row_is_kept, tests/test_transcript_gate_uncertainty.py::test_an_unnamed_row_holds_a_shared_folder_until_it_is_confirmed, tests/test_transcript_gate_uncertainty.py::test_a_cwd_reload_never_moves_where_an_engagement_is_held, tests/test_transcript_confirmation.py::test_a_finalize_cancelled_before_its_tail_confirms_its_summary_row, tests/test_transcript_gate_uncertainty.py::test_a_rebuilt_or_resumed_engagement_stays_in_its_launch_folder, tests/test_transcript_retention.py::test_a_tombstone_waits_for_its_transcripts_across_downtime, tests/test_transcript_retention.py::test_a_held_transcript_keeps_its_tombstone_until_it_goes, tests/test_transcript_retention.py::test_a_record_with_nothing_to_reap_still_ages_out]
    INV-ENG-028: [tests/test_delegated_transcript_retention.py::test_a_delegated_transcript_survives_the_run, tests/test_delegated_transcript_retention.py::test_confirmation_follows_the_answers_capture, tests/test_delegated_transcript_retention.py::test_a_failed_request_capture_leaves_the_run_unconfirmed, tests/test_delegated_transcript_retention.py::test_a_spooled_answer_confirms_the_run, tests/test_delegated_transcript_retention.py::test_kill_before_the_result_leaves_the_run_unresolved, tests/test_delegated_transcript_retention.py::test_kill_before_registration_starts_no_cli, tests/test_delegated_transcript_retention.py::test_cancelled_before_result_confirms_without_an_answer, tests/test_delegated_transcript_retention.py::test_a_non_memory_run_registers_confirmed, tests/test_delegated_transcript_retention.py::test_retention_counts_from_the_run_end, tests/test_delegated_transcript_retention.py::test_only_the_named_session_is_deleted, tests/test_cross_session_tools.py::test_one_shot_launches_persist_no_session, tests/test_transcript_confirmation.py::test_every_run_kind_registers_before_its_first_capture, tests/test_delegated_transcript_retention.py::test_a_delegated_run_launches_in_the_folder_its_row_names]
