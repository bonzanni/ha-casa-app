# Manifest shard: the engagement documents about files root handles from outside an engagement
# (born in their own shard so the E shard, split at the 40 KB index ceiling, keeps its headroom).
- doc: architecture/engagement-workspace-access.md
  summary: Root's crossings into a claude_code engagement's workspace — the no-follow accessors it reads and writes through, and the control directory that keeps root-only run-state off the workspace root.
  when_changing: root's access into a workspace, or where root-only engagement run-state lives
  covers:
    - casa/rootfs/opt/casa/safe_fs.py::open_beneath
    - casa/rootfs/opt/casa/safe_fs.py::read_text_beneath
    - casa/rootfs/opt/casa/safe_fs.py::atomic_write_beneath
    - casa/rootfs/opt/casa/drivers/workspace.py::provision_control_dir
  tests:
    - tests/test_safe_fs.py
    - tests/test_root_workspace_accessor_inventory.py
  related: [architecture/engagement-containment.md, architecture/engagements.md]
  defines_invariants: [INV-CONT-002, INV-CONT-003]
  invariant_tests:
    INV-CONT-002: [tests/test_safe_fs.py::test_refuses_symlink_final_component, tests/test_safe_fs.py::test_refuses_symlink_intermediate_component, tests/test_safe_fs.py::test_owner_uid_mismatch_refused]
    INV-CONT-003: [tests/test_root_workspace_accessor_inventory.py::test_no_control_state_under_workspace_root]
- doc: architecture/engagement-transcript-reaping.md
  summary: Where a finished engagement's CLI transcripts are deleted — the retention, the run-confirmation gate the pass and the workspace sweep ask, what a terminal record names, what it never selects, and what it retries.
  when_changing: deleting a finished engagement's transcripts
  covers:
    - casa/rootfs/opt/casa/engagement_transcript_reaper.py::reap_engagement_transcripts
    - casa/rootfs/opt/casa/engagement_transcript_reaper.py::transcript_cwd
  tests:
    - tests/test_engagement_transcript_reaper.py
    - tests/test_engagement_transcript_reaper_pins.py
    - tests/test_transcript_confirmation.py
    - tests/test_transcript_retention.py
  related: [architecture/engagement-finalization.md, architecture/memory-lifecycle.md, architecture/persistent-state.md, architecture/background-job-fresh-sessions.md]
  defines_invariants: [INV-ENG-027]
  invariant_tests:
    INV-ENG-027: [tests/test_engagement_transcript_reaper.py::test_terminal_sdk_transcripts_are_reaped, tests/test_engagement_transcript_reaper_pins.py::test_named_sessions_go_in_the_record_dir_zero_byte_included, tests/test_engagement_transcript_reaper_pins.py::test_nothing_a_terminal_record_does_not_name_is_touched, tests/test_engagement_transcript_reaper_pins.py::test_a_live_engagement_is_never_touched, tests/test_engagement_transcript_reaper_pins.py::test_a_terminal_status_not_yet_on_disk_is_not_acted_on, tests/test_engagement_transcript_reaper_pins.py::test_a_session_named_after_a_pass_goes_on_the_next, tests/test_engagement_transcript_reaper_pins.py::test_the_reaper_imports_without_the_private_sdk_surface, tests/test_engagement_transcript_reaper_pins.py::test_an_unavailable_private_surface_deletes_nothing_and_retries, tests/test_engagement_transcript_reaper_pins.py::test_clearance_retired_sessions_survive_restart_until_terminal_reap, tests/test_engagement_transcript_reaper_pins.py::test_plugin_workdir_reaped_only_after_durable_terminal_independent_of_sdk, tests/test_engagement_transcript_reaper_pins.py::test_never_written_tombstone_is_quiet_but_waiting_terminal_warns, tests/test_engagement_transcript_reaper_pins.py::test_an_entry_vanishing_mid_walk_does_not_stop_the_removal, tests/test_transcript_retention.py::test_an_engagement_transcript_lives_its_retention_after_its_terminal_record, tests/test_transcript_retention.py::test_a_claude_code_workspace_keeps_its_seven_day_retention_once_gated, tests/test_transcript_confirmation.py::test_a_summary_row_blocks_until_its_summaries_are_captured, tests/test_transcript_confirmation.py::test_a_lost_terminal_flip_confirms_its_summary_row, tests/test_transcript_confirmation.py::test_a_summary_run_is_one_row_holding_its_folder, tests/test_transcript_gate_uncertainty.py::test_a_session_published_after_the_summary_row_is_kept, tests/test_transcript_gate_uncertainty.py::test_an_unnamed_row_holds_a_shared_folder_until_it_is_confirmed, tests/test_transcript_retention.py::test_the_workspace_sweep_never_holds_the_event_loop, tests/test_transcript_gate_uncertainty.py::test_a_cwd_reload_never_moves_where_an_engagement_is_held, tests/test_transcript_confirmation.py::test_a_finalize_cancelled_before_its_tail_confirms_its_summary_row]
