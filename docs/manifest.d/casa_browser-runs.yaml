- doc: reference/casa-browser-contract.md
  summary: The Casa Browser protocol v1 contract as a trusted caller (Casa's browsing plugin) relies on it — every request and reply member, bound, error code, event kind and the locale contract, gathered in one place, with the fake controller that serves the same wire.
  when_changing: a /v1 request or reply member, a bound on one (text lengths, list sizes), an event kind or outcome, an error code, the admission digest, the locale reported by hello, the fake controller
  covers:
    - casa_browser/tests/fake_controller.py
    - casa_browser/tests/vectors/spec_digest.json
  tests:
    - casa_browser/tests/test_protocol.py
    - casa_browser/tests/test_api_auth.py
    - casa_browser/tests/integration/test_adversarial_sites.py
  related: [reference/casa-browser.md, reference/casa-browser-runs.md, reference/casa-browser-approvals.md, reference/casa-browser-files.md, reference/casa-browser-ingress.md]
