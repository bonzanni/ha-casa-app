# Manifest shard — the built-in secrets store document, born in its own shard because the
# A-D shard stands near the 40 KB index ceiling. Loaded with the root docs/manifest.yaml by
# scripts/verify_docs.py; same entry format.

- doc: architecture/builtin-secrets-store.md
  summary: Where secrets live when no 1Password token is set — the start-time backend choice, the op front, the op forms the store answers, its service, socket, files and key, and the secrets page on ingress.
  when_changing: the secrets backend choice or its file, the op front, the op command lines the built-in store answers, its service or sockets, the store's files or key, CASA_VAULT_KEY, or the secrets page, its nginx locations, forms, checks or Secrets link
  covers:
    - casa/rootfs/opt/casa/vault_store.py
    - casa/rootfs/opt/casa/vault_op.py
    - casa/rootfs/opt/casa/vault_service.py
    - casa/rootfs/opt/casa/vault_op_client.py
    - casa/rootfs/opt/casa/vault_page.py
    - casa/rootfs/opt/casa/vault_static/page.js
    - casa/rootfs/opt/casa/vault_static/theme.js
    - casa/rootfs/opt/casa/vault_static/ha.css
    - casa/rootfs/opt/casa/vault_static/vault.css
    - casa/rootfs/opt/casa/casa_core.py::_status_page
    - casa/rootfs/usr/local/bin/op
    - casa/rootfs/opt/casa/scripts/secrets-backend-lib.sh
    - casa/rootfs/etc/s6-overlay/scripts/secrets-backend.sh
    - casa/rootfs/etc/s6-overlay/s6-rc.d/svc-vault/run
    - casa/rootfs/etc/s6-overlay/s6-rc.d/svc-vault/finish
  tests:
    - tests/test_vault_store.py
    - tests/test_vault_op.py
    - tests/test_vault_service.py
    - tests/test_vault_page.py
    - tests/test_vault_page_static.py
    - tests/test_vault_page_behaviour.py
    - tests/test_setup_nginx_ingress.py
    - tests/test_casa_status_page.py
    - tests/test_vault_real_callers.py
    - tests/test_vault_finance_plugin.py
    - tests/test_secrets_backend_scripts.py
    - tests/test_set_plugin_env_reference_guard.py
  related: [architecture/http-surface.md, architecture/configuration.md, architecture/overview.md, architecture/vault-drop-off.md, architecture/plugin-secret-exploration.md, architecture/persistent-state.md]
  defines_invariants: [INV-VAULT-001, INV-VAULT-002, INV-VAULT-003, INV-VAULT-004, INV-VAULT-005, INV-VAULT-006, INV-VAULT-007, INV-VAULT-008, INV-VAULT-009]
  invariant_tests:
    INV-VAULT-001: [tests/test_secrets_backend_scripts.py::test_front_takes_no_backend_from_the_environment, tests/test_secrets_backend_scripts.py::test_front_with_anything_but_the_exact_word_execs_the_real_binary, tests/test_secrets_backend_scripts.py::test_front_with_no_file_execs_the_real_binary, tests/test_secrets_backend_scripts.py::test_helper_backend, tests/test_secrets_backend_scripts.py::test_helper_takes_no_backend_from_the_environment, tests/test_secrets_backend_scripts.py::test_backend_script_writes_builtin_for_empty_and_null_and_1password_otherwise]
    INV-VAULT-002: [tests/test_secrets_backend_scripts.py::test_front_on_1password_execs_the_real_binary_untouched, tests/test_secrets_backend_scripts.py::test_front_on_1password_changes_only_what_a_shell_script_owns]
    INV-VAULT-003: [tests/test_vault_op.py::test_unsupported_never_succeeds]
    INV-VAULT-004: [tests/test_vault_store.py::test_existing_file_with_missing_key_raises_and_leaves_bytes_unchanged, tests/test_vault_store.py::test_existing_file_with_wrong_env_key_raises_and_leaves_bytes_unchanged, tests/test_vault_store.py::test_existing_file_with_wrong_key_file_raises_and_leaves_bytes_unchanged, tests/test_vault_store.py::test_an_empty_key_file_is_a_key_problem_and_nothing_is_written, tests/test_vault_service.py::test_wrong_key_creates_no_socket_signals_ready_and_stays_up, tests/test_vault_service.py::test_a_damaged_store_file_creates_no_socket_signals_ready_and_stays_up]
    INV-VAULT-005: [tests/test_setup_nginx_ingress.py::test_the_secrets_page_is_served_on_ingress_for_the_built_in_store, tests/test_setup_nginx_ingress.py::test_the_secrets_page_answers_404_everywhere_otherwise]
    INV-VAULT-006: [tests/test_vault_page.py::test_one_secret_shows_plain_fields_and_masks_secret_ones, tests/test_vault_page.py::test_no_get_response_ever_contains_a_secret_value, tests/test_vault_page.py::test_the_edit_form_never_contains_a_secret_value, tests/test_vault_page.py::test_the_list_copies_a_one_value_secret_with_a_show_form_of_its_own, tests/test_vault_page.py::test_an_empty_hidden_value_looks_like_any_other_before_a_show]
    INV-VAULT-007: [tests/test_vault_page.py::test_a_post_without_a_code_with_a_used_code_or_an_expired_code_is_refused, tests/test_vault_page.py::test_a_code_is_bound_to_its_path, tests/test_vault_page.py::test_a_code_authorises_exactly_one_operation, tests/test_vault_page.py::test_a_post_from_another_origin_is_refused, tests/test_vault_page.py::test_a_post_without_origin_is_accepted_only_with_fetch_site_same_origin]
    INV-VAULT-008: [tests/test_vault_page.py::test_a_secret_that_changed_since_the_form_was_opened_is_not_overwritten, tests/test_vault_page.py::test_a_change_within_the_same_second_is_still_seen, tests/test_vault_page.py::test_a_change_to_the_tags_alone_within_the_same_second_is_still_seen, tests/test_vault_page.py::test_a_change_to_the_title_alone_within_the_same_second_is_still_seen, tests/test_vault_page.py::test_a_reorder_within_the_same_second_is_still_seen, tests/test_vault_page.py::test_a_change_to_a_values_type_alone_within_the_same_second_is_still_seen, tests/test_vault_page.py::test_a_change_to_a_values_label_alone_within_the_same_second_is_still_seen]
    INV-VAULT-009: [tests/test_vault_service.py::test_a_page_that_cannot_start_costs_only_the_page, tests/test_vault_service.py::test_a_page_that_fails_once_bound_leaves_no_socket, tests/test_vault_service.py::test_a_store_that_cannot_be_opened_and_a_page_that_cannot_start_still_signal_ready]
