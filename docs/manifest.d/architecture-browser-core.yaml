# Manifest shard: the specialist hand-off, plugin operator-call, continuation and Stop
# documents (born in their own shard: the S and plugin-M-R shards stand near the index
# ceiling).
- doc: architecture/specialist-handoff.md
  summary: A specialist answering a request hands part of it to another specialist and gets the answer back — the hand_off tool, the requester chain and the operator's words every delegated run carries, the mechanical bounds, the permit, and the requester's ceiling a hand-off pauses.
  when_changing: the hand_off tool or its bounds, the requester chain, the operator's words or the operator-task proof on a delegated origin, the caller a delegated run names, or the ceiling clock a hand-off pauses
  covers:
    - casa/rootfs/opt/casa/handoff.py
    - casa/rootfs/opt/casa/tools.py::hand_off
    - casa/rootfs/opt/casa/tools.py::_handoff_grants
    - casa/rootfs/opt/casa/tools.py::_CeilingClock
    - casa/rootfs/opt/casa/tools.py::_wait_under_ceiling
    - casa/rootfs/opt/casa/specialist_limits.py::SpecialistLimiter.try_acquire_scope_only
  tests:
    - tests/test_handoff.py
  related: [architecture/delegation.md, architecture/memory-lifecycle.md, architecture/plugin-operator-calls.md, architecture/agent-lane.md]
  defines_invariants: [INV-ENG-025, INV-ENG-026, INV-ENG-032]
  invariant_tests:
    INV-ENG-025: [tests/test_handoff.py::test_bounds_refuse_a_cycle_and_a_handoff_past_the_limit, tests/test_handoff.py::test_handoff_refuses_a_cycle_and_does_not_run, tests/test_handoff.py::test_handoff_refuses_past_the_limit, tests/test_handoff.py::test_handoff_is_unavailable_outside_a_specialist_run, tests/test_handoff.py::test_handoff_display_name_must_be_unique, tests/test_handoff.py::test_handoff_to_a_resident_is_unknown, tests/test_handoff.py::test_handoff_returns_the_answer_to_the_requester, tests/test_handoff.py::test_handoff_from_a_specialists_own_chat_runs_as_the_chains_root, tests/test_handoff.py::test_handoff_from_an_own_chat_keeps_the_other_refusals]
    INV-ENG-026: [tests/test_handoff.py::test_clock_leaves_paused_time_out, tests/test_handoff.py::test_requester_ceiling_does_not_run_while_its_handoff_runs]
