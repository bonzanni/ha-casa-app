- doc: architecture/plugin-continuations.md
  summary: How a plugin's work that outlives one turn is carried on in fresh turns of its specialist — the continuation queue, the origin rebuilt from a binding, the relay of the answer up the requester chain, and the once-a-minute driver sweep.
  when_changing: the continuation queue or turn, the origin a continuation runs under, how a continuation's answer reaches its requesters, a role's session.long_runs, the casa.driverSweep declaration, the driver sweep's direct call or the plugin resolution and client it shares with the stop, or how a stopped request's queued continuations are dropped
  covers:
    - casa/rootfs/opt/casa/plugin_continuations.py
    - casa/rootfs/opt/casa/plugin_store.py::manifest_driver_sweep
  tests:
    - tests/test_plugin_continuations.py
  related: [architecture/plugin-operator-calls.md, architecture/agent-lane.md, architecture/delegation-announcements.md, architecture/specialist-handoff.md]
