- doc: architecture/background-job-quiet-runs.md
  summary: A plugin job declaring quietWhenScheduled — a run its schedule started opens no topic, posts no progress line, and is told nowhere when it completes unless it asked the operator something or was answered, while its plugin's delivered slots still reach the operator.
  when_changing: the quietWhenScheduled job option, a quiet run's missing topic, its withheld turn stream, the notices it skips, its grant identity, how its end is told, or how interacting with it ends its quietness
  covers:
    - casa/rootfs/opt/casa/background_jobs.py::is_quiet_run
    - casa/rootfs/opt/casa/background_jobs.py::is_quiet_origin
    - casa/rootfs/opt/casa/drivers/in_casa_driver.py::_WithheldStream
    - casa/rootfs/opt/casa/channels/telegram.py::_require_topic
    - casa/rootfs/opt/casa/tools.py::_told_nowhere
    - casa/rootfs/opt/casa/engagement_registry.py::EngagementRegistry.promote_from_quiet
  tests:
    - tests/test_quiet_scheduled_jobs.py
    - tests/test_job_dm_attention.py
    - tests/test_job_dm_posts_registry.py
  related: [architecture/background-jobs.md, architecture/job-triggers.md, architecture/plugin-delivered-slots.md, architecture/engagement-finalization.md]
  defines_invariants: [INV-BGJOB-010, INV-BGJOB-015]
  invariant_tests:
    INV-BGJOB-015: [tests/test_job_dm_attention.py::TestQuietRunsEndOnInteraction::test_a_quiet_run_that_asks_is_told_at_its_end, tests/test_job_dm_attention.py::TestQuietRunsEndOnInteraction::test_a_reply_ends_a_quiet_runs_quietness_so_its_end_is_told, tests/test_job_dm_attention.py::TestQuietRunsEndOnInteraction::test_a_quiet_run_nobody_interacted_with_is_told_nowhere, tests/test_job_dm_attention.py::TestQuietRunsEndOnInteraction::test_a_reply_racing_a_pending_quiet_completion_is_told_once, tests/test_job_dm_attention.py::TestQuietRunsEndOnInteraction::test_a_reply_racing_a_quiet_completion_that_rolls_back_is_delivered, tests/test_job_dm_attention.py::TestQuietRunsEndOnInteraction::test_a_completion_entering_while_a_promotion_commits_owes_the_telling, tests/test_job_dm_posts_registry.py::TestQuietPromotion::test_a_failed_write_rolls_the_stamp_back_and_refuses, tests/test_job_dm_posts_registry.py::TestQuietPromotion::test_promotion_after_a_pending_completion_commits_is_refused_and_owes_nothing]
    INV-BGJOB-010: [tests/test_quiet_scheduled_jobs.py::test_a_quiet_scheduled_run_opens_no_topic_and_posts_nothing, tests/test_quiet_scheduled_jobs.py::test_a_quiet_runs_later_turn_and_progress_post_nothing, tests/test_quiet_scheduled_jobs.py::test_every_other_run_opens_its_topic_as_today, tests/test_quiet_scheduled_jobs.py::test_a_topic_send_without_a_topic_refuses_rather_than_post_to_general, tests/test_quiet_scheduled_jobs.py::test_a_quiet_run_keeps_the_operators_grant_identity, tests/test_quiet_scheduled_jobs.py::test_a_completed_quiet_run_is_told_nowhere_and_a_failed_one_is_told, tests/test_quiet_scheduled_jobs.py::test_a_completed_run_that_is_not_quiet_is_still_told, tests/test_quiet_scheduled_jobs.py::test_only_a_scheduled_start_of_a_quiet_job_is_quiet]
