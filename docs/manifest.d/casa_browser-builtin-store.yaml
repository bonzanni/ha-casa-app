# Manifest shard — the Casa Browser app's own login store, in a shard of its own as Casa's
# built-in secrets store document is. Loaded with the root docs/manifest.yaml by
# scripts/verify_docs.py; same entry format.

- doc: reference/casa-browser-builtin-store.md
  summary: Where Casa Browser keeps site logins when no 1Password token is set — the login store chosen at start, the store's files and CASA_BROWSER_VAULT_KEY, the second vault and its version rule, what does not run in that mode, and a site's link kept per store, and the Saved logins page that runs only in that mode.
  when_changing: the choice of login store or the login_store word, the app's own store or its key, BuiltinVault, build_vault, a site's link per store (the registry's builtin key, the builtin_links table), the Saved logins page (its login profile, its socket, its nginx locations or logins-conf, what a save or a delete there does to a site's link), the links in the broker's status or the controller's copy of them (refresh_links), the files shared with Casa or sync_shared_vault, or anything that behaves differently with no 1Password token
  covers:
    - casa_browser/rootfs/opt/casa_browser/broker/builtin.py
    - casa_browser/rootfs/opt/casa_browser/vault_store.py
    - casa_browser/rootfs/opt/casa_browser/broker/logins_page.py
    - casa_browser/rootfs/opt/casa_browser/vault_page.py
    - casa_browser/rootfs/opt/casa_browser/vault_page_server.py
    - casa_browser/rootfs/opt/casa_browser/vault_static/page.js
    - casa_browser/rootfs/opt/casa_browser/vault_static/theme.js
    - casa_browser/rootfs/opt/casa_browser/vault_static/ha.css
    - casa_browser/rootfs/opt/casa_browser/vault_static/vault.css
    - scripts/sync_shared_vault.py
    - casa_browser/rootfs/opt/casa_browser/broker/main.py::run
    - casa_browser/rootfs/opt/casa_browser/broker/main.py::Broker.login_changed
    - casa_browser/rootfs/opt/casa_browser/broker/main.py::Broker.login_deleted
    - casa_browser/rootfs/opt/casa_browser/controller.py::RunController.refresh_links
    - casa_browser/rootfs/opt/casa_browser/store.py::Store.builtin_links
    - casa_browser/rootfs/opt/casa_browser/store.py::Store.clear_builtin_link
    - casa_browser/rootfs/opt/casa_browser/ui.py::logins_conf
    - casa_browser/rootfs/opt/casa_browser/broker/main.py::build_vault
