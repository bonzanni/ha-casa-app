# Publication allowlist (git-tracked only). Verify: python -m scripts.verify_docs .

- doc: manifest.d/architecture-a-d.yaml
  kind: meta
  summary: Manifest shard — architecture documents A-D.

- doc: manifest.d/architecture-e.yaml
  kind: meta
  summary: Manifest shard — architecture documents E.

- doc: manifest.d/architecture-f-m.yaml
  kind: meta
  summary: Manifest shard — architecture documents F-M.

- doc: manifest.d/architecture-n-r.yaml
  kind: meta
  summary: Manifest shard — architecture documents N-R.

- doc: manifest.d/architecture-s-z.yaml
  kind: meta
  summary: Manifest shard — architecture documents S-Z.

- doc: manifest.yaml
  kind: meta
  summary: The publication allowlist for this corpus.

- doc: coverage.yaml
  kind: meta
  summary: Code-derived coverage ledger — every enumerated surface maps to a document or an explicit exclusion.

- doc: README.md
  kind: index
  summary: Routing map — what you are about to change, and what to read for it.

- doc: llms.txt
  kind: generated
  summary: Flat index of the corpus, generated from this manifest.

- doc: doctrine/invariants.md
  kind: generated
  summary: Every INV-* id in families A-M, its statement, and the file that defines it.

- doc: doctrine/invariants-n-z.md
  kind: generated
  summary: Every INV-* id in families N-Z, its statement, and the file that defines it.

- doc: reference/operator-options.md
  summary: The option-by-option operator contract — key, env var, consumer, default, restart-vs-reload.
  when_changing: adding or removing an app option, or changing what consumes one
  covers:
    - casa/config.yaml::options
    - casa/config.yaml::schema
    - casa/rootfs/etc/s6-overlay/scripts/setup-configs.sh
    - casa/rootfs/opt/casa/timekeeping.py::resolve_tz
    - casa/rootfs/opt/casa/specialist_limits.py::SpecialistLimiter
  tests:
    - tests/test_run_script_env.py
  related: [architecture/configuration.md, architecture/overview.md]

- doc: doctrine/publishing.md
  summary: The one rule that decides whether a fact may be written down in this repository.
  when_changing: anything published — docs, comments, commit messages, PR text, branch names
  covers:
    - .githooks/pre-commit
    - .githooks/deny-patterns.txt
    - scripts/deny-sweep.sh
    - scripts/gate.sh
    - scripts/attest.sh
    - .githooks/pre-push
  tests:
    - tests/test_deny_sweep.py
    - tests/test_leak_guard.py
    - tests/test_gate_hook.py
  related: [contributing/doc-contract.md]
  defines_invariants: [INV-PUB-001, INV-PUB-002, INV-PUB-003, INV-PUB-004]
  invariant_tests:
    INV-PUB-001: [tests/test_deny_sweep.py::test_a_denied_literal_is_caught, tests/test_leak_guard.py::test_a_denied_path_is_rejected]
    INV-PUB-002: [tests/test_pin_doc_corpus_shape.py::test_pin_inv_pub_002_doctrine_carries_no_dated_history]
    INV-PUB-003: [tests/test_gate_hook.py::test_a_gated_push_without_an_attestation_is_refused, tests/test_gate_hook.py::test_the_automated_receipt_alone_does_not_authorise_a_push]
    INV-PUB-004: [tests/test_gate_hook.py::test_a_re_cut_onto_a_moved_main_pushes_over_its_own_ref, tests/test_gate_hook.py::test_a_re_cut_carrying_an_unreviewed_commit_is_still_refused_by_name]

- doc: doctrine/operating-casa.md
  summary: How an agent running inside Casa should behave, and which property of the system each rule follows from.
  when_changing: agent prompts, refusal text, or anything shaping how an agent acts at runtime
  covers:
    - casa/rootfs/opt/casa/semantic_memory.py::RecallUnavailable
    - casa/rootfs/opt/casa/authz_grants.py::GrantKey
    - casa/rootfs/opt/casa/tools.py::emit_completion
  tests:
    - tests/test_recall_absence_invariant.py
    - tests/test_authz_grants.py
  related: [architecture/memory.md, architecture/engagements.md, architecture/engagement-finalization.md, architecture/engagement-completion-gate.md, architecture/voice.md]

- doc: doctrine/working-on-casa.md
  summary: How to change this repository without breaking it, and how to establish that a claim about it is true.
  when_changing: the contribution rules, the verification discipline, or how documentation is kept honest
  covers:
    - scripts/verify_docs.py::verify
    - casa/config.yaml::schema
  tests:
    - tests/test_verify_docs.py
  related: [doctrine/publishing.md, contributing/doc-contract.md, architecture/persistent-state.md]

- doc: contributing/doc-contract.md
  summary: The shape a document takes, and which of its rules CI enforces versus a reviewer.
  when_changing: the documentation rules themselves, or adding a document to the corpus
  covers:
    - scripts/verify_docs.py::verify
    - scripts/verify_docs.py::check_ceilings
    - scripts/verify_docs.py::_check_sourcemap
    - scripts/verify_docs.py::_check_invariants
    - scripts/verify_docs.py::_check_prose_invariant_references
    - scripts/verify_docs.py::write_nav
    - scripts/coverage_ledger.py::check
  tests:
    - tests/test_verify_docs.py
    - tests/test_coverage_ledger.py
    - tests/test_docs_impact_contract.py
  related: [doctrine/publishing.md]
  defines_invariants: [INV-DOC-001, INV-DOC-002, INV-DOC-003, INV-DOC-004, INV-DOC-005, INV-DOC-007, INV-DOC-008, INV-DOC-009, INV-DOC-010]
  invariant_tests:
    INV-DOC-001: [tests/test_pin_doc_corpus_shape.py::test_pin_inv_doc_001_front_matter_and_code_wins_line]
    INV-DOC-002: [tests/test_pin_doc_corpus_shape.py::test_pin_inv_doc_002_architecture_documents_follow_the_section_order]
    INV-DOC-003: [tests/test_pin_doc_corpus_shape.py::test_pin_inv_doc_003_no_changelog_voice_markers]
    INV-DOC-004: [tests/test_verify_docs.py::test_an_invariant_defined_twice_is_caught]
    INV-DOC-005: [tests/test_verify_docs.py::test_a_line_number_anchor_is_rejected]
    INV-DOC-007:
      - tests/test_verify_docs.py::test_a_touched_document_past_the_ceiling_at_the_base_fails
      - tests/test_verify_docs.py::test_a_document_born_over_the_ceiling_fails
    INV-DOC-008:
      - tests/test_docs_impact_contract.py::test_inv_doc_008_a_waiver_for_an_updated_document_is_refused
      - tests/test_docs_impact_contract.py::test_inv_doc_008_only_the_tip_commit_may_carry_a_waiver
    INV-DOC-010:
      - tests/test_verify_docs.py::test_write_nav_refuses_an_unloadable_shard_without_writing
      - tests/test_verify_docs.py::test_bare_cli_reports_a_broken_shard_before_navigation_staleness
      - tests/test_verify_docs.py::test_manifest_load_failure_precedes_report_and_write_nav
    INV-DOC-009:
      - tests/test_verify_docs.py::test_a_python_docstring_citing_an_undefined_id_in_a_defined_family_is_caught
