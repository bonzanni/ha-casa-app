name: Docs

# The corpus in docs/ is published, so these checks run on every pull request and on main.
#
# The mandatory control is still the local pre-push gate (scripts/gate.sh plus the
# attestation it requires): it refuses BEFORE anything is published, which a CI check
# reporting after a pull request exists cannot do. What CI adds is a second pair of eyes on
# every PR and a check that runs in a clone nobody has configured.
#
# Since 2026-08-02 the "Corpus + publication guard" job below is also a REQUIRED status
# check on `main`, with admin enforcement and strict mode — so a merge cannot outrun it and
# `--admin` cannot wave it through, which is how PR #383's drift shipped. Protection is the
# backstop for the path the hook cannot see (hooks uninstalled, or --no-verify); it is not
# a substitute for the gate, and only THIS job is required — the qa.yml tiers deliberately
# are not, because ship-fast merges without waiting for them.
#
# CI deliberately has NO private supplement: the exact-literal layer lives with the operator
# and is applied by the hook and the gate. CI runs the generic patterns and the scanner.
#
# READ THIS BEFORE TRUSTING A GREEN RESULT. Every script and policy file this job runs comes
# from the pull request's own checkout, so a PR can weaken its own guard — replace a scanner
# with a no-op, relax the deny patterns, delete a step. `pull_request` is still the right
# event (it keeps secrets and a write token away from PR-controlled code), and this is an
# accepted property rather than a defect, because the mandatory control is the local gate.
# The consequence is concrete: a PR touching .github/workflows/, scripts/, .githooks/ or
# tests/ needs privileged human review, and its green check proves nothing on its own.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs-verify:
    name: Corpus + publication guard
    runs-on: ubuntu-latest
    env:
      CASA_ALLOW_NO_SUPPLEMENT: "1" # CI has no private supplement, by design
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the range sweeps need history, not just the tip

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml

      - name: Verify manifest, anchors, budget and invariants
        run: |
          python -m scripts.verify_docs .
          python3 scripts/coverage_ledger.py check .

      - name: Docs-impact acknowledgement logic
        # The waiver parser is the part of this gate that can let drift through
        # deliberately, and it runs only on push/pull_request events — so it
        # would otherwise be unexercised until the change that depends on it.
        # The harness drives scripts/docs_impact.sh, which is the one copy both
        # this workflow and scripts/gate.sh call.
        run: bash tests/test_docs_impact_ack.sh

      - name: Generated navigation is current
        run: python -m scripts.verify_docs . --check-nav

      - name: Size report (growth pressure, informational)
        run: python -m scripts.verify_docs . --report

      - name: Operating cards point at the doctrine
        run: |
          set -euo pipefail
          # Cards are prose and wrap at ~95 columns, so both required phrases can
          # legitimately span a line break — normalise newlines before matching.
          for card in CLAUDE.md AGENTS.md; do
            flat="$(tr '\n' ' ' < "$card" | tr -s ' ')"
            printf '%s' "$flat" | grep -q 'verifiable from the public commit alone' || {
              echo "::error::$card no longer states the publication rule"; exit 1; }
            printf '%s' "$flat" | grep -Eq "docs/README\.md.{0,20}routing table" || {
              echo "::error::$card no longer routes agents into the docs corpus (needs the docs/README.md routing-table directive)"; exit 1; }
          done

      - name: Deny sweep — tracked tree
        run: scripts/deny-sweep.sh tree

      - name: Deny sweep — the commits this PR would publish
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          # merge-base..HEAD, not base...HEAD: `git rev-list A...B` is the SYMMETRIC
          # difference, so it would sweep commits that are on the base and not in this PR.
          # Three dots is right for `git diff`, wrong for enumerating what this PR adds.
          range="$(git merge-base "$base" HEAD)..HEAD"
          scripts/deny-sweep.sh range "$range"
          scripts/deny-sweep.sh messages "$range"

      - name: Secret scan
        run: |
          set -euo pipefail
          # The runner cannot write to root-owned /usr/local/bin.
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" gitleaks
          chmod +x "$RUNNER_TEMP/bin/gitleaks"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          scripts/run-gitleaks.sh tree
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            scripts/run-gitleaks.sh range "$(git merge-base "$base" HEAD)..HEAD"
          fi

      - name: Docs impact on claimed surfaces
        # Backstop. The BINDING copy runs in scripts/gate.sh at pre-push, before
        # anything is published; this catches a push made with hooks uninstalled
        # or --no-verify, and anything arriving from elsewhere.
        #
        # Runs on PUSH as well as pull_request (Terra): a hook-bypassing push
        # would otherwise face no check at all. Branch protection now rejects
        # such a push to `main` outright, so this arm covers what protection
        # does not — any other protected-or-not branch, and the record on `main`
        # itself after a merge. On push the range is the event's before..after;
        # the waivers are read from the pushed tip.
        #
        # `head.sha`, never HEAD, on a pull request: actions/checkout leaves HEAD
        # at GitHub's synthetic MERGE commit, whose message carries no waiver.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            ack="${{ github.event.pull_request.head.sha }}"
          else
            before="${{ github.event.before }}"
            # Terra+Sol: falling back to origin/<default_branch> FAILS OPEN on a
            # push to that same branch — checkout has already moved it to the
            # pushed tip, so the comparison is HEAD against itself and nothing
            # is ever impacted. There is no sound predecessor to substitute for
            # a force-push or a brand-new branch, so refuse and say why. The
            # pre-push gate is the binding check; this backstop declining to
            # guess is correct, and the operator can re-run against a real base.
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
               || ! git rev-parse --verify --quiet "$before" >/dev/null; then
              echo "::error::push event has no reachable predecessor" \
                   "(new branch or force-push): cannot determine what changed."
              echo "::error::Re-run from a pull request, or push a normal" \
                   "fast-forward so before..after is meaningful."
              exit 1
            fi
            # Sol: reachable is not enough. A non-fast-forward push — a
            # backward reset, or an old tip still reachable via another ref —
            # leaves `before` resolvable while `before...HEAD` (merge-base)
            # collapses to an empty diff. Require real ancestry.
            if ! git merge-base --is-ancestor "$before" HEAD; then
              echo "::error::push is not a fast-forward from ${before}:" \
                   "the changed set cannot be derived. Push a fast-forward," \
                   "or run this from a pull request."
              exit 1
            fi
            base="$before"
            ack="${{ github.sha }}"
          fi
          scripts/docs_impact.sh "$base" "$ack"
