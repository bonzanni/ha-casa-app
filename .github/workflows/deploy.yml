name: Deploy

# Container image pipeline for every app folder in this repository: Casa (casa/) and,
# once that folder exists, the optional Casa Browser app (casa_browser/).
#
# `select` asks scripts/browser-release-matrix.py which apps this change touches; a change
# to the shared pipeline (this file, deploy-app.yml, the script) selects every app that
# exists, so each is at least validated. `deploy` then runs deploy-app.yml once per
# selected app — that reusable workflow owns one app's build, publication and release,
# and it publishes only on a push whose version is not released yet. An app folder that
# does not exist is never selected, so it publishes nothing.

on:
  push:
    branches: [main]
    paths:
      - "casa/**"
      - "casa_browser/**"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/deploy-app.yml"
      - "scripts/browser-release-matrix.py"
  pull_request:
    paths:
      - "casa/**"
      - "casa_browser/**"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/deploy-app.yml"
      - "scripts/browser-release-matrix.py"

permissions:
  contents: read

jobs:
  select:
    name: Select apps
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the diff below needs both ends of the change
          persist-credentials: false

      - name: Select the apps this change touches
        id: select
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          matrix="$(python3 scripts/browser-release-matrix.py select --base "$BASE" --head "$HEAD")"
          echo "selected: ${matrix}"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  deploy:
    name: ${{ matrix.app }}
    needs: select
    if: needs.select.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    # One group per app and version on main: a second run for the same version waits
    # instead of racing it, while different versions never wait on (or, as a single
    # pending slot would, silently replace) each other. A release in progress is never
    # cancelled; a pull request's superseded validation build is.
    concurrency:
      group: deploy-${{ matrix.app }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || matrix.version }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: write # the release job's tag + GitHub Release
      id-token: write # Cosign keyless signing (OIDC)
      packages: write # push images and manifests to GHCR
    uses: ./.github/workflows/deploy-app.yml
    with:
      app: ${{ matrix.app }}
