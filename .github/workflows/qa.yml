name: QA
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * *"     # 04:00 UTC daily
  workflow_dispatch: {}     # manual trigger from any branch

jobs:
  tier1-smoke:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -f test-local/Dockerfile.test -t casa-test .
      - name: Smoke
        run: bash test-local/e2e/test_smoke.sh
      - name: Voice SSE
        run: bash test-local/e2e/test_voice_sse.sh
      - name: Voice WS
        run: |
          pip install aiohttp
          bash test-local/e2e/test_voice_ws.sh

  tier2-functional:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # pyflakes powers tests/test_no_undefined_names.py, which importorskips
      # without it — a skipped guard would not have caught the v0.125.0
      # boot-path NameError, so it must be installed here, not just locally.
      - run: pip install -r casa/requirements.txt pytest pytest-asyncio pytest-xdist anyio pyflakes
      - name: Unit pytest (opt-out gate — everything except docker/slow)
        run: python -m pytest tests/ -m "not docker and not slow" -v -n auto --maxprocesses=12 --dist loadfile --tb=short
      # GHSA-569r-7crq-xr43's guarantee is about what an unprivileged uid can
      # READ, so the pinning test forks and setuid()s to check it for real
      # instead of asserting mode bits. That needs to start as root, which this
      # runner is not — and the test skips itself when it cannot drop privilege,
      # so without an explicitly root lane it would silently never execute
      # anywhere. Its own first assertion is that the probe CAN read a
      # deliberately world-readable file, so a broken harness fails loudly
      # rather than reporting everything as protected.
      - name: Private-state inventory, verified as a dropped uid (root lane)
        run: |
          docker run --rm -v "$PWD":/w -w /w -u 0:0 python:3.11-slim sh -c '
            pip install -q pytest pytest-asyncio &&
            PYTHONPATH=casa/rootfs/opt/casa python -m pytest \
              tests/test_private_state_dropped_uid.py -v --tb=short -p no:cacheprovider'
      - name: Build image
        run: docker build -f test-local/Dockerfile.test -t casa-test .
      - name: Invoke sessions
        run: bash test-local/e2e/test_invoke_sessions.sh
      - name: External surface
        run: bash test-local/e2e/test_external_surface.sh
      - name: Delegation
        run: bash test-local/e2e/test_specialist_delegation.sh
      - name: Specialist install-from-repo + persona-swap epoch (final gate)
        run: bash test-local/e2e/test_specialist_install_from_repo.sh
      - name: Bundled specialist one-flow install + uninstall cascade
        run: bash test-local/e2e/test_bundled_specialist_install.sh
      - name: E2E - scheduling
        run: bash test-local/e2e/test_scheduling.sh
      - name: Engagement E-block
        run: |
          pip install aiohttp
          bash test-local/e2e/test_engagement_E.sh
      - name: Delegation E-block
        run: bash test-local/e2e/test_delegation_E.sh
      - name: HA delegation
        run: |
          pip install aiohttp
          bash test-local/e2e/test_ha_delegation.sh
      # P-block stays disabled until v0.14.10's D/P-block sweep ships.
      # When re-enabled, uncomment the step below (env vars stay):
      # - name: Engagement P-block
      #   env:
      #     CASA_USE_MOCK_CLAUDE: "1"
      #     CASA_PLAN_4B: "1"
      #   run: bash test-local/e2e/test_engagement_P.sh

  baseline-runtime:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # pyflakes powers tests/test_no_undefined_names.py, which importorskips
      # without it — a skipped guard would not have caught the v0.125.0
      # boot-path NameError, so it must be installed here, not just locally.
      - run: pip install -r casa/requirements.txt pytest pytest-asyncio pytest-xdist anyio pyflakes
      - name: Baseline runtime CI assertion
        run: python -m pytest tests/test_baseline_runtime_assert.py -v -m "docker and not slow" --tb=short

  tier3-hardening:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # pyflakes powers tests/test_no_undefined_names.py, which importorskips
      # without it — a skipped guard would not have caught the v0.125.0
      # boot-path NameError, so it must be installed here, not just locally.
      - run: pip install -r casa/requirements.txt pytest pytest-asyncio pytest-xdist anyio pyflakes
      - name: Slow pytest
        # `|| true` is intentional and temporary: until Half 2 audits the
        # 954 unmarked tests + decides which @slow are real vs Windows-only
        # flakes, we don't want a single broken @slow test breaking nightly.
        run: python -m pytest tests/ -v -m "slow" --tb=short || true
      - name: Build image
        run: docker build -f test-local/Dockerfile.test -t casa-test .
      - name: Concurrency
        run: bash test-local/e2e/test_concurrency.sh
      - name: MCP restart survival
        env:
          CASA_USE_MOCK_CLAUDE: "1"
        run: bash test-local/e2e/test_mcp_restart_survival.sh
      # D-block stays disabled until v0.14.10's D/P-block sweep ships.
      # When re-enabled, uncomment the step below (env var stays):
      # - name: Engagement D-block
      #   env:
      #     CASA_USE_MOCK_CLAUDE: "1"
      #   run: bash test-local/e2e/test_engagement_D.sh

  # A scheduled-only tier can stay red for a week with nothing to show for it.
  # tier3-hardening does not run on pull requests and does not run on the push
  # builds either, so every PR and every release run stayed green while the
  # nightly failed seven times running (#585) — the failure was found by hand.
  # This job is the missing signal: one tracking issue, a comment per red
  # night, nothing at all while the nightly is green.
  nightly-alarm:
    needs: [tier1-smoke, tier3-hardening]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: File or update the nightly-failure tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          title="Scheduled QA run is failing on main"
          # Narrow server-side, then compare exactly. Listing open issues and
          # filtering locally would cap at the page size, so an older tracking
          # issue past the cap reads as absent and gets duplicated every night;
          # the exact compare still decides, because `--search` is fuzzy.
          num="$(gh issue list --state open --search "\"$title\" in:title" \
                  --limit 1000 --json number,title \
                  --jq "[.[] | select(.title == \"$title\")] | .[0].number // empty")"
          note="Scheduled \`qa.yml\` run failed: $RUN_URL (\`$SHA\`)."
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$note"
            exit 0
          fi
          cat > /tmp/body.md <<EOF
          $note

          Filed automatically by the \`nightly-alarm\` job in \`qa.yml\`. The scheduled
          run exercises tiers that pull requests and push builds skip, so a failure
          here is not visible anywhere else.

          This issue stays open and collects one comment per failing night. Close it
          once the nightly is green again.
          EOF
          gh issue create --title "$title" \
            --label bug --label severity:medium --body-file /tmp/body.md
