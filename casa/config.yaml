name: "Casa"
description: "An always-on fleet of Claude agents — assistant, butler, concierge and specialists you add"
version: "0.278.0"
slug: casa
url: https://github.com/bonzanni/ha-casa-app
image: "ghcr.io/bonzanni/casa"
init: false
timeout: 120
arch:
  - aarch64
  - amd64
homeassistant_api: true
hassio_api: true
discovery: [casa]
ingress: true
ingress_port: 8080
ports:
  "18065/tcp": null
ports_description:
  "18065/tcp": "External API (webhooks, invoke, Telegram webhook)"
map:
  - addon_config:rw
options:
  # Network
  public_url: ""

  # Secrets
  claude_oauth_token: ""
  telegram_bot_token: ""
  telegram_chat_id: ""
  telegram_engagement_supergroup_id: 0
  telegram_bot_api_base: ""
  telegram_transport: "polling"
  hindsight_api_url: ""
  onepassword_service_account_token: ""
  onepassword_default_vault: "Casa"
  webhook_secret: ""
  context7_api_key: ""

  # Model selection
  primary_agent_model: "opus"
  voice_agent_model: "haiku"

  # Web terminal
  enable_terminal: false

  # Scheduling
  casa_tz: ""
  engagement_reap_days: 7

  # Logging (#279: was schema-only; the omission predates the option audit.
  # Behavior is unchanged — absent/empty falls back to INFO — but every
  # schema key now has an install-time default.)
  log_level: "info"

  # Specialist limits (spec A4/§4.6)
  specialist_max_concurrency: 2
  specialist_cost_alert_threshold: 5.0

# NOTE: removing an option below leaves its stored value behind; HA logs a
# boot WARN ("Option '<key>' does not exist in the schema") until the stored
# options are cleaned by hand. Casa itself ignores unknown option keys.
schema:
  public_url: str?
  claude_oauth_token: password
  telegram_bot_token: password?
  telegram_chat_id: str?
  telegram_engagement_supergroup_id: int?
  telegram_bot_api_base: "str?"
  telegram_transport: "list(polling|webhook)?"
  hindsight_api_url: str?
  onepassword_service_account_token: password?
  onepassword_default_vault: str?
  webhook_secret: password?
  context7_api_key: password?
  primary_agent_model: "list(opus|sonnet|haiku)?"
  voice_agent_model: "list(opus|sonnet|haiku)?"
  enable_terminal: bool?
  casa_tz: str?
  engagement_reap_days: int?
  log_level: "list(debug|info|warning|error)?"
  specialist_max_concurrency: "int(1,20)?"
  specialist_cost_alert_threshold: "float(0,)?"
