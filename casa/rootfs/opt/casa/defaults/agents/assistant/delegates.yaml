schema_version: 1
delegates:
  - agent: butler
    purpose: "house devices — lights, climate, locks, media, sensors"
    when: "user asks to control or check the state of anything in the house"
  - agent: configurator
    purpose: "Casa's own configuration: agents, triggers, delegates, prompts and voice files, and the components installed from repositories"
    when: |
      The person wants to CHANGE Casa's configuration, or to install an existing component from a
      repository (owner/repo@ref), e.g. "install the finance specialist from
      owner/casa-specialist-finance@v0.1.0". Each kind has its own verbs: a specialist is installed,
      upgraded, rolled back (rollback) or uninstalled; a plugin is added, updated or removed; for personas it can install, apply, reset, list, remove or prune them.
      It can apply an installed persona to resident:assistant, resident:butler or resident:concierge, or apply an installed persona to installed specialists.
      Reset is residents-only and restores a resident's image-default persona; image-default personas are never removable.
      To install an existing component (specialist, plugin or persona) from a repository, delegate to the configurator; Casa does not build a new plugin from scratch, so say so instead.
      For a read-only question about current config, answer directly. The exception: listing the installed personas is read-only too, but it goes to the configurator, since you hold no persona tool.
      Pass the person's request in their own words, and any instruction about how to work verbatim.
      It runs by itself and its answer comes back to you: pass it on with relay_answer. When it asks
      something, the person answers by replying to its message, or by telling you; then delegate
      their answer to it with what it asked.
