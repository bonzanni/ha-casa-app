schema_version: 1
kind: resident
model:
  source: ha_option
  option: primary_agent_model
  default: opus
  allowed: [opus, sonnet, haiku]
enabled: true
tools:
  allowed:
    - Read
    - Write
    - Edit
    - Skill
    - mcp__casa-framework__cancel_engagement
    - mcp__casa-framework__cleanup_engagement_topics
    - mcp__casa-framework__delegate_to_agent
    - mcp__casa-framework__engage_executor
    - mcp__casa-framework__ask_user
    - mcp__casa-framework__get_schedule
    - mcp__casa-framework__set_reminder
    - mcp__casa-framework__cancel_reminder
    # #419 — a headless event wake cannot ask for approval; without this
    # every nudge would stall to budget exhaustion since ack_event could
    # never actually run.
    - mcp__casa-framework__ack_event
    # #494 — on-demand re-issue of an expired/missed plugin-consent DM.
    # Router-compatible: it triggers a server-posted keyboard, the ONLY
    # surface whose Approve commits; never relay a consent via ask_user.
    - mcp__casa-framework__consent_reprompt
    - mcp__casa-framework__recall_memory
    - mcp__casa-framework__send_message
    - mcp__casa-framework__send_media
  disallowed:
    # #460: the assistant is a router—all concrete work is delegated.
    # Broad Bash is unused authority and must be fenced via CLI-enforcement.
    - Bash
    # Agent/Task: Q-1 (v0.69.8) — the assistant is a pure router that delegates
    # via mcp__casa-framework__delegate_to_agent and must not spawn sub-agents
    # (they bypass allowed_tools + the fail-closed callback; disallowed is
    # CLI-enforced).
    - Agent
    - Task
    # #396: session-scoped schedulers. These outlive nothing — CronCreate
    # reports "Session-only (not written to disk, dies when Claude exits)" —
    # so a reminder set through one is silently discarded at the next
    # restart, after the user has been told it is set. Note that tools.allowed
    # is an AUTO-APPROVE list, not a deny list, which is how these were
    # reachable without ever being listed. Use set_reminder instead.
    - CronCreate
    - CronDelete
    - CronList
    - ToolSearch
    # The built-in `schedule` skill creates cloud routines against a claude.ai
    # account a Casa install has no connection to; it fails at call time.
    - Skill(schedule)
  permission_mode: acceptEdits
  max_turns: 20
mcp_server_names:
  - casa-framework
memory:
  token_budget: 5000                     # Phase 5 — honest envelope for 40/60 overlay/scope split
  read_strategy: per_turn
channels:
  - telegram
  - webhook
session:
  strategy: persistent
  idle_timeout: 86400
cwd: ""
