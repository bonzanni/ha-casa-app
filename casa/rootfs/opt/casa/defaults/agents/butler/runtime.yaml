schema_version: 1
kind: resident
model:
  source: ha_option
  option: voice_agent_model
  default: haiku
  allowed: [opus, sonnet, haiku]
enabled: true
tools:
  allowed:
    - Read
    - mcp__casa-framework__get_schedule
    - mcp__casa-framework__recall_memory
    - mcp__homeassistant
    # #419 — a headless event wake cannot ask for approval; without this
    # every nudge would stall to budget exhaustion since ack_event could
    # never actually run (any resident role may be an operator-assigned
    # event-delivery target).
    - mcp__casa-framework__ack_event
  # Agent/Task: Q-1 (v0.69.8) — butler must not spawn sub-agents (they bypass
  # allowed_tools + the fail-closed callback; disallowed is CLI-enforced).
  disallowed:
    # #396: the CLI's own schedulers, outside Casa's: a reminder set through
    # one is not a Casa reminder, whatever the user was told. Use set_reminder
    # instead. CronCreate can persist jobs (bundle default `durable: true`),
    # and a CLI wake-up runs an unprompted turn while the CLI process lives
    # (measured, #1258). Every Casa session also denies these in code
    # (claude_runtime.SELF_SCHEDULING_TOOLS). Note that tools.allowed is an
    # AUTO-APPROVE list, not a deny list, which is how these were reachable
    # without ever being listed.
    - CronCreate
    - CronDelete
    - CronList
    - ToolSearch
    # The built-in `schedule` skill creates cloud routines against a claude.ai
    # account a Casa install has no connection to; it fails at call time.
    - Skill(schedule)
    - Bash
    - Write
    - Edit
    - Agent
    - Task
  permission_mode: acceptEdits
  max_turns: 10
  skills: none
  voice_guard: ha_direct
mcp_server_names:
  - homeassistant
  - casa-framework
memory:
  token_budget: 800
  read_strategy: cached
channels:
  - ha_voice
session:
  strategy: pooled
  idle_timeout: 300
tts:
  tag_dialect: square_brackets
voice_errors:
  timeout:       "[apologetic] Hm, that took too long. Try again?"
  rate_limit:    "[flat] My brain is busy — give me a minute."
  sdk_error:     "[apologetic] I couldn't reach my brain. Try again?"
  memory_error:  ""
  channel_error: "[flat] Something went wrong sending that."
  voice_tool_loop: "[apologetic] I couldn't resolve that cleanly. Try naming the device again?"
  unknown:       "[flat] Sorry, something went wrong."
cwd: ""
